<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Notepad — Sign In</title>
<style>
  :root {
    --bg: #f2f4f9;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e6e8ef;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.06);
    --accent: #6366f1;
    --accent-soft: #eef0fe;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --radius: 16px;
    --radius-sm: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015;
      --card-bg: #171a21;
      --text: #e7e9ee;
      --muted: #9aa1ac;
      --border: #2a2f3a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.28);
      --accent-soft: #1c1e33;
      --danger-soft: #2a1616;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px 24px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .tabs {
    display: flex;
    background: var(--accent-soft);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 20px;
  }

  .tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .tabs button.active {
    background: var(--card-bg);
    color: var(--accent);
    box-shadow: var(--shadow);
  }

  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }

  label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="email"], input[type="password"] {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    font-family: inherit;
  }

  input[type="email"]:focus, input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button[type="submit"] {
    margin-top: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
  }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .error {
    display: none;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 8px;
  }
  .error.show { display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Wallet Notepad</h1>
  <p class="subtitle">Sign in to view your income, initiative, and monthly budget.</p>

  <div class="tabs">
    <button type="button" id="tab-login" class="active">Sign In</button>
    <button type="button" id="tab-signup">Sign Up</button>
  </div>

  <div class="error" id="error"></div>

  <form id="login-form" class="active">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Sign In</button>
  </form>

  <form id="signup-form">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password (min 6 characters)
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <button type="submit">Create Account</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  const errorEl = document.getElementById("error");

  function showTab(which) {
    errorEl.classList.remove("show");
    const isLogin = which === "login";
    tabLogin.classList.toggle("active", isLogin);
    tabSignup.classList.toggle("active", !isLogin);
    loginForm.classList.toggle("active", isLogin);
    signupForm.classList.toggle("active", !isLogin);
  }

  tabLogin.addEventListener("click", () => showTab("login"));
  tabSignup.addEventListener("click", () => showTab("signup"));

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add("show");
  }

  async function submit(form, url) {
    const button = form.querySelector("button[type=submit]");
    const data = Object.fromEntries(new FormData(form).entries());
    errorEl.classList.remove("show");
    button.disabled = true;
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(body.error || "Something went wrong.");
        return;
      }
      window.location.href = "/";
    } catch (err) {
      showError("Could not reach the server.");
    } finally {
      button.disabled = false;
    }
  }

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    submit(loginForm, "/api/auth/login");
  });

  signupForm.addEventListener("submit", (e) => {
    e.preventDefault();
    submit(signupForm, "/api/auth/signup");
  });
})();
</script>

</body>
</html>
